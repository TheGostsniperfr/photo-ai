[project]
name = "photo-ai-bot"
version = "0.1.0"
description = "Discord bot — trigger photo AI pipeline, monitor progress, serve as dashboard"
authors = [
    {name = "TheGostsniperfr", email = "brianperret.pro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
]

[tool.poetry]
packages = [{include = "photo_ai_bot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
photo-ai-bot = "photo_ai_bot.main:main"
