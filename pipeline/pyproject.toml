[project]
name = "photo-ai"
version = "0.1.0"
description = "GPU-accelerated photo AI pipeline — tagging, captioning, face recognition, semantic search"
authors = [
    {name = "TheGostsniperfr", email = "brianperret.pro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AI / ML — torch installed from CUDA source, see [[tool.poetry.source]]
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0,<4.46.0",
    "sentence-transformers>=3.2.0,<4.0.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.19.0",
    # Data & vision
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    # Storage
    "qdrant-client>=1.12.0,<1.13.0",
    "asyncpg>=0.29.0",
    # HTTP
    "httpx>=0.27.0",
    # Metadata
    "pyexiftool>=0.5.6",
    # CLI / config
    "click>=8.1.7",
    "rich>=13.8.0",
    "pydantic-settings>=2.5.0",
    # Runner (serve mode)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.poetry]
packages = [{include = "photo_ai", from = "src"}]

# PyTorch CUDA 12.6 wheels — used in Docker; override torch/torchvision from here
[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
photo-ai = "photo_ai.__main__:cli"
